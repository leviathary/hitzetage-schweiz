services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      FEEDBACK_FILE: /app/data/feedback.jsonl
    volumes:
      - feedback-data:/app/data
    restart: unless-stopped

volumes:
  feedback-data:
